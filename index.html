  `);

  // OMA: kurze graublonde Wellen, hellblauer Blazer, gelbe Bluse/Schleife.
  if(s==="OPA") return svg(`

  // KIND / KINDER: markanter Pilzkopf, hellblaues Hemd,
  // riesige schwarze Schleife und camel-farbener Blazer.
  if(s==="KIND" || s==="KINDER") return svg(`
    <rect x="26" y="15" width="53" height="8" fill="#756b59"/>

  // HELGA: in den Referenzfotos nicht separat vorhanden – deshalb bewusst
  // als eigene, neutrale junge Figur, damit sie nicht mit Mami verwechselt wird.
  if(s==="HELGA") return svg(`

}

function render(){const c=cues[i];progress.textContent=(i+1)+" / "+cues.length;speaker.textContent=labels[c.speaker]||c.speaker;zh.textContent=c.zh;de.textContent=c.de;portrait.innerHTML=pixelPortrait(c.speaker);localStorage.setItem("bertaCue",i)}
function nextCue(){if(i<cues.length-1){i++;render()}}function prevCue(){if(i>0){i--;render()}}function startShow(){start.style.display="none";render();try{document.documentElement.requestFullscreen?.()}catch(e){}}
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key===" "||e.key==="Enter")nextCue();if(e.key==="ArrowLeft")prevCue()});render();
</script></body></html>
