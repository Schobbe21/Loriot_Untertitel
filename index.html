function render(){const c=cues[i];progress.textContent=(i+1)+" / "+cues.length;speaker.textContent=labels[c.speaker]||c.speaker;zh.textContent=c.zh;de.textContent=c.de;portrait.innerHTML=(c.speaker==="PAUSE"?"":pixelPortrait(c.speaker));localStorage.setItem("bertaCue",i)}
function nextCue(){if(i<cues.length-1){i++;render()}}function prevCue(){if(i>0){i--;render()}}function startShow(){start.style.display="none";render();try{document.documentElement.requestFullscreen?.()}catch(e){}}

document.getElementById("jumpEnd").addEventListener("click",e=>{e.stopPropagation();i=cues.length-1;render();});
function jumpToCue(){const n=parseInt(cueInput.value,10);if(Number.isFinite(n)){i=Math.max(0,Math.min(cues.length-1,n-1));render();cueInput.blur();}}
